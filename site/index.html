<title>UI System Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool. A slim control bar on top, then one or two full-height frames of the same test page. */
:root {
  --bg: #eef0ef;
  --panel: #ffffff;
  --fg: #1b2120;
  --muted: #5f6a68;
  --line: #d7dcda;
  --accent: #1f6b64;
  --accent-fg: #ffffff;
  --chip: #e3e8e6;
  --warn: #b4441f;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --panel: #1a1f1e; --fg: #e6ebe9; --muted: #95a19e; --line: #2c3432;
    --accent: #5fbcb1; --accent-fg: #0d1514; --chip: #242b2a; --warn: #f0885e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1a1f1e; --fg: #e6ebe9; --muted: #95a19e; --line: #2c3432;
  --accent: #5fbcb1; --accent-fg: #0d1514; --chip: #242b2a; --warn: #f0885e; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px;
  display: flex; flex-direction: column;
}
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 600; font-size: 14px; margin-right: 4px; }
.group { display: flex; align-items: center; gap: 6px; }
.group > .lbl { color: var(--muted); }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  font: inherit; color: var(--muted); background: transparent; border: 0; border-radius: 6px;
  padding: 5px 10px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.seg button:focus-visible, select:focus-visible, .chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; max-width: 280px;
}
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.chk input { accent-color: var(--accent); }
.spacer { flex: 1; }
.keys { color: var(--muted); }
kbd {
  font-family: var(--font-ui); font-size: 11px; background: var(--chip); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 5px; color: var(--fg);
}
.stage {
  flex: 1; min-height: 0; display: grid; gap: 12px;
  padding-block: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.stage.split { grid-template-columns: 1fr 1fr; }
@media (max-width: 800px) { .stage.split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.pane-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pane-head strong { font-weight: 600; }
.pane-head span { color: var(--muted); }
.frame-wrap {
  flex: 1; min-height: 0; display: flex; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
iframe { border: 0; width: 100%; height: 100%; background: #fff; transition: width .2s ease; }
.frame-wrap.narrow iframe { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.empty {
  margin: auto; max-width: 42ch; text-align: center; color: var(--muted); padding: 24px; line-height: 1.5;
}
.empty strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 6px; }
.rate-on { color: var(--accent); font-weight: 500; }
@media (max-width: 1500px) { .keys { display: none; } }
.compare-only[hidden] { display: none !important; }
.bar2 { background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 8px; }
.swatches { display: inline-flex; gap: 4px; align-items: center; }
.sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.sw.none { background: conic-gradient(from 45deg, var(--line) 0 25%, var(--panel) 0 50%, var(--line) 0 75%, var(--panel) 0); }
.sw:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=color] { width: 24px; height: 22px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--panel); cursor: pointer; }
.btn { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.status { color: var(--muted); min-width: 0; }
@media (max-width: 800px) { .sep { display: none; } }

.report { flex: 1; min-height: 0; overflow-y: auto; }
.report-inner { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.report-inner > * { min-width: 0; }
.report h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
.report h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.report p { margin: 0; line-height: 1.55; }
.lede { font-size: 14px; max-width: 72ch; color: var(--fg); }
.sub { color: var(--muted); max-width: 72ch; line-height: 1.5; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
td.wrap { white-space: normal; min-width: 180px; max-width: 260px; line-height: 1.35; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--chip); }
tr.base td { color: var(--muted); }
.rank { color: var(--muted); width: 28px; }
.sys { font-weight: 500; }
.dots { display: inline-flex; gap: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--accent); }
.avg { font-weight: 600; }
.chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.bad { color: var(--warn); font-weight: 500; }
.groups { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.group-card { padding: 14px 16px; display: grid; gap: 6px; }
.group-card strong { font-weight: 600; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.card { padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card-head strong { font-size: 14px; font-weight: 600; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.45; }
.card .lbl2 { font-size: 12px; color: var(--muted); font-weight: 500; }
.card button.open { justify-self: start; font: inherit; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.card button.open:hover { border-color: var(--accent); }
.card button.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.links { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.links a, .ext { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
.links a:hover, .ext:hover { text-decoration-color: currentColor; }
.links a:focus-visible, .ext:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.score { display: inline-flex; white-space: nowrap; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.sbar { width: 34px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: inline-block; }
.sbar > span { display: block; height: 100%; background: var(--accent); }
.bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.mini { height: 6px; border-radius: 3px; background: var(--accent); opacity: .7; }
.mini.hot { background: var(--warn); opacity: .9; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar" role="toolbar" aria-label="Comparison controls">
  <span class="brand">UI System Lab</span>

  <div class="seg" id="page">
    <button type="button" data-v="compare" aria-pressed="true">Compare</button>
    <button type="button" data-v="report" aria-pressed="false">Report</button>
  </div>

  <div class="group compare-only">
    <span class="lbl">View</span>
    <div class="seg" id="mode">
      <button type="button" data-v="single" aria-pressed="true">Single</button>
      <button type="button" data-v="split" aria-pressed="false">Side by side</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Width</span>
    <div class="seg" id="width">
      <button type="button" data-v="fill" aria-pressed="true">Full</button>
      <button type="button" data-v="820" aria-pressed="false">Tablet</button>
      <button type="button" data-v="390" aria-pressed="false">Phone</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Theme</span>
    <div class="seg" id="theme">
      <button type="button" data-v="light" aria-pressed="true">Light</button>
      <button type="button" data-v="dark" aria-pressed="false">Dark</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Motion</span>
    <div class="seg" id="rate">
      <button type="button" data-v="1" aria-pressed="true">1×</button>
      <button type="button" data-v="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-v="0.2" aria-pressed="false">0.2×</button>
    </div>
  </div>

  <label class="chk compare-only"><input type="checkbox" id="sync" checked> Sync scroll</label>

  <span class="spacer"></span>
  <span class="keys compare-only"><kbd>1</kbd>–<kbd>9</kbd> variant · <kbd>S</kbd> split · <kbd>M</kbd> slow motion · <kbd>D</kbd> theme · <kbd>R</kbd> report</span>
</div>

<div class="bar bar2 compare-only" role="toolbar" aria-label="Brand stress test and synced actions">
  <div class="group">
    <span class="lbl">Primary</span>
    <div class="swatches" id="swatches">
      <button type="button" class="sw none" data-c="" aria-label="Each variant's own primary color" aria-pressed="true" title="Variant's own"></button>
      <button type="button" class="sw" data-c="#e8590c" style="background:#e8590c" aria-label="Orange" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#f5c400" style="background:#f5c400" aria-label="Yellow" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#2f9e44" style="background:#2f9e44" aria-label="Green" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#1c7ed6" style="background:#1c7ed6" aria-label="Blue" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#7048e8" style="background:#7048e8" aria-label="Violet" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#d6336c" style="background:#d6336c" aria-label="Pink" aria-pressed="false"></button>
      <input type="color" id="primary-custom" value="#0ca678" aria-label="Custom primary color" title="Custom color">
    </div>
  </div>
  <div class="group">
    <label class="lbl" for="font">Font</label>
    <select id="font">
      <option value="">Variant's own</option>
      <option value="inter">Inter</option>
      <option value="geist">Geist</option>
      <option value="plex">IBM Plex Sans</option>
      <option value="manrope">Manrope</option>
      <option value="dm-sans">DM Sans</option>
      <option value="source-serif">Source Serif 4</option>
    </select>
  </div>
  <div class="group">
    <span class="lbl">Density</span>
    <div class="seg" id="density">
      <button type="button" data-v="compact" aria-pressed="false">Compact</button>
      <button type="button" data-v="" aria-pressed="true">Default</button>
      <button type="button" data-v="comfortable" aria-pressed="false">Comfortable</button>
    </div>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <div class="group">
    <label class="lbl" for="action">Play in both</label>
    <select id="action">
      <optgroup label="Overlays">
        <option value="dialog">Open dialog (New project)</option>
        <option value="menu">Open project menu</option>
        <option value="sheet">Open side panel</option>
        <option value="popover">Open filter popover</option>
        <option value="combobox">Open people picker</option>
        <option value="command">Open command menu</option>
      </optgroup>
      <optgroup label="Lists">
        <option value="task-add">Add a task</option>
        <option value="task-complete">Complete first open task</option>
        <option value="task-move">Move first task down</option>
        <option value="task-sort">Toggle sort by due date</option>
        <option value="task-remove">Remove a task</option>
        <option value="tab">Next tab</option>
      </optgroup>
      <optgroup label="Table">
        <option value="ledger-sort">Sort by amount</option>
        <option value="ledger-next">Next page</option>
        <option value="ledger-filter">Search “north”</option>
        <option value="ledger-empty">Search with no results</option>
        <option value="ledger-clear">Clear filters</option>
      </optgroup>
      <optgroup label="Form">
        <option value="wizard-fill">Fill in a valid client</option>
        <option value="wizard-invalid">Enter a bad email</option>
        <option value="wizard-next">Next step</option>
        <option value="wizard-back">Previous step</option>
        <option value="wizard-cancel">Cancel with unsaved changes</option>
      </optgroup>
      <optgroup label="Feedback">
        <option value="toast">Show a toast</option>
        <option value="save-fail">Save that fails (then Retry)</option>
        <option value="retry">Retry</option>
        <option value="offline">Toggle offline</option>
        <option value="reload">Reload entries</option>
      </optgroup>
    </select>
    <button type="button" class="btn primary" id="play">Play</button>
    <button type="button" class="btn" id="close-all">Close</button>
    <button type="button" class="btn" id="tour">Tour</button>
  </div>
  <span class="status" id="status" role="status"></span>
</div>
<div class="stage" id="stage"></div>
<div class="report" id="report" hidden><div class="report-inner" id="report-inner"></div></div>

const REVIEW = {"summary": "kemiljk ranked first. Its skills treated messy data and edge cases as part of the design: long client names wrap, missing ledger values read 'No due date' or 'Not tied to a project', the total notes 'net of 1 credit', and the benchmark showed no meaningful cost. taste came a close second with the most complete visual rethink, a sidebar app shell and a header summary that leads with what needs attention, and it was the only variant with no sampled contrast failures in either theme; a clipped Add button and truncated phone amounts held its fidelity score down. skills and ui-craft followed, with ui-craft drawing the accessibility judge's top rank but losing points for a phone layout that is 895px wide in a 390px viewport. The systems that helped this app most were rule sets about content, semantics and layout that the agent applied to the existing shadcn components, while motion-only skills (feel-better, emil, uiwiki) left the page looking and scoring like the baseline. The libraries cost the most: Fluid Functionalism added about 233 KB of gzipped JavaScript and 332 KB of fonts and lost input borders and the phone grid, Magic UI added about 54 KB of JavaScript for effects judges did not count as improvements, and the libraries.dev effects raised blocking time from about 1 s to about 23 s and kept roughly a third of the main thread busy at idle. For a working app UI, start with a content and behavior skill such as kemiljk or skills, add a visual-direction skill like taste if the product needs a new look, and check the phone layout and font weight it adds before shipping.", "method": "One Fieldwork page (React, Tailwind and default shadcn/ui) was rebuilt eleven times, each by a separate AI agent that read only one system's documentation. Three blind judges, a product designer, a design engineer and an accessibility and UX-writing specialist, scored anonymized builds on five axes against the unchanged baseline at 3. Performance was measured in function render() {

function makePane(i) {
  const v = byId(state.panes[i]);
  const pane = document.createElement("section");
  pane.className = "pane";

  const head = document.createElement("div");
  head.className = "pane-head";
  const sel = document.createElement("select");
  sel.id = "pick-" + i;
  sel.setAttribute("aria-label", i === 0 ? "Left variant" : "Right variant");
  VARIANTS.forEach((o, n) => {
    const opt = document.createElement("option");
    opt.value = o.id;
    opt.textContent = (n + 1) + ". " + o.name + (o.ready ? "" : " (not built)");
    if (o.id === v.id) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => { state.panes[i] = sel.value; state.active = i; render(); });
  sel.addEventListener("focus", () => { state.active = i; });
  const note = document.createElement("span");
  note.textContent = v.note;
  head.append(sel, note);

  const wrap = document.createElement("div");
  wrap.className = "frame-wrap" + (state.width !== "fill" ? " narrow" : "");
  if (v.ready) {
    const f = document.createElement("iframe");
    f.title = v.name;
    f.src = v.path + "?theme=" + state.theme;
    if (state.width !== "fill") f.style.width = state.width + "px";
    f.addEventListener("load", () => {
      post(f, { type: "lab:rate", rate: state.rate });
      post(f, { type: "lab:brand", brand: state.brand });
      setTimeout(() => post(f, { type: "lab:scroll", ratio: state.scroll }), 120);
    });
    wrap.appendChild(f);
  } else {
    wrap.innerHTML = '<div class="empty"><strong>' + v.name + ' isn’t built yet</strong>This variant will be the baseline page with ' + v.name + ' applied. Pick Baseline to see the starting point.</div>';
  }
  pane.append(head, wrap);
  return pane;
}

function syncSegs() {
  const vals = { mode: state.mode, width: String(state.width), theme: state.theme, rate: String(state.rate) };
  for (const [id, val] of Object.entries(vals)) {
    document.querySelectorAll("#" + id + " button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === val)));
  }
  document.getElementById("sync").checked = state.sync;
}

function setOpt(key, val) {
  state[key] = val;
  if (key === "mode" || key === "width") { render(); return; }
  if (key === "theme") frames().forEach((f) => post(f, { type: "lab:theme", theme: val }));
  if (key === "rate") frames().forEach((f) => post(f, { type: "lab:rate", rate: val }));
  syncSegs(); save();
}

document.querySelectorAll(".seg").forEach((seg) => {
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const v = b.dataset.v;
    if (seg.id === "page") { showPage(v); return; }
    setOpt(seg.id, seg.id === "rate" ? Number(v) : v);

});

window.addEventListener("message", (e) => {

    const i = frames().findIndex((f) => f.contentWindow === e.source);
    if (i >= 0) state.active = i;
    onKey(d.key);
    return;
  }
  if (d.type !== "lab:scroll") return;
  state.scroll = d.ratio;
  if (!state.sync) return;
  frames().forEach((f) => { if (f.contentWindow !== e.source) post(f, d); });
});

// Shortcuts also work while a frame has focus: the bridge script inside each variant forwards them.
function onKey(key) {
  if (key === "r") { showPage(state.page === "report" ? "compare" : "report"); return; }
  if (state.page === "report") return;
  const n = Number(key);
  if (n >= 1 && n <= Math.min(9, VARIANTS.length)) {
    const target = state.mode === "split" ? state.active : 0;
    state.panes[target] = VARIANTS[n - 1].id;
    render();
  } else if (key === "s") setOpt("mode", state.mode === "split" ? "single" : "split");
  else if (key === "m") setOpt("rate", state.rate === 1 ? 0.2 : 1);
  else if (key === "d") setOpt("theme", state.theme === "dark" ? "light" : "dark");
}

    const hot = (v, b, f) => (v > b * f ? ' class="num bad"' : ' class="num"');
    const idleV = IDLE[id] != null ? IDLE[id] + "%" : "≈0%";
    h += '<tr class="clickable' + (id === "baseline" ? " base" : "") + '" data-open="' + id + '" tabindex="0"><td class="sys">' + esc(nameOf(id)) + '</td><td class="num"><span class="bar-cell"><span class="mini' + (m.jsGz > base.jsGz * 1.25 ? " hot" : "") + '" style="width:' + Math.round((60 * m.jsGz) / maxJs) + 'px"></span>' + m.jsGz + ' KB</span></td><td class="num">' + (m.font ? m.font + " KB" : "–") + "</td><td" + hot(m.lcp || 99999, base.lcp, 1.3) + ">" + (m.lcp ? m.lcp.toLocaleString() + " ms" : "not reached") + "</td><td" + hot(m.tbt, base.tbt, 1.5) + ">" + m.tbt.toLocaleString() + " ms</td><td" + hot(m.p95, base.p95, 2) + ">" + m.p95 + " ms</td><td" + ((IDLE[id] || 0) > 5 ? ' class="num bad"' : ' class="num"') + ">" + idleV + "</td><td>" + esc(DEPS[id] || "none") + "</td></tr>";
  });
  h += "</tbody></table></div></section>";

  h += '<section><h2>System notes</h2><div class="cards">' + order.map((id, i) => {
    const r = REVIEW.systems[id];
    return '<article class="panel card"><div class="card-head"><strong>' + (i + 1) + ". " + esc(nameOf(id)) + '</strong><span class="chip">' + avgOf(id).toFixed(2) + " avg</span></div>" + linksOf(id) + "<p>" + esc(r.verdict) + "</p>" +
      (r.highlights && r.highlights.length ? '<div><div class="lbl2">Look for</div><ul>' + r.highlights.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>" : "") +
      (r.issues && r.issues.length ? '<div><div class="lbl2">Problems found</div><ul>' + r.issues.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>" : "") +
      '<p class="sub">Change size: ' + esc(r.effort) + '</p><button type="button" class="open" data-open="' + id + '">Compare with baseline</button></article>';
  }).join("") + "</div></section>";

  h += '<section><h2>Not included</h2><div class="panel tbl-wrap"><table><tbody>' + [
    ["transitions.dev", "https://transitions.dev", "Its recipes are only on its website, which the build environment couldn’t reach."],
    ["addyosmani/agent-skills", "https://github.com/addyosmani/agent-skills", "General engineering skills. Its one frontend guide overlaps with the dedicated systems."],
    ["mattpocock/skills", "https://github.com/mattpocock/skills", "Engineering workflow skills (TDD, tickets, PRs), not UI."],
  ].map(([n, u, why]) => '<tr><td><a class="ext" href="' + u + '" target="_blank" rel="noopener">' + esc(n) + '</a></td><td style="white-space:normal">' + esc(why) + "</td></tr>").join("") + "</tbody></table></div></section>";

  h += '<section class="sub"><h2 style="color:var(--fg)">How this was made</h2>' + METHOD_HTML + "</section>";
  reportInner.innerHTML = h;
  reportInner.addEventListener("click", (e) => { if (e.target.closest("a")) return; const t = e.target.closest("[data-open]"); if (t) openCompare(t.dataset.open); });
  reportInner.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.target.closest("a")) { const t = e.target.closest("tr[data-open]"); if (t) openCompare(t.dataset.open); } });
}

function openCompare(id) {
  state.mode = id === "baseline" ? "single" : "split";
  state.panes = id === "baseline" ? ["baseline", state.panes[1]] : ["baseline", id];
  showPage("compare");
}

function showPage(pg) {
  state.page = pg;
  const isReport = pg === "report";
  reportEl.hidden = !isReport;
  stage.hidden = isReport;
  document.querySelectorAll(".compare-only").forEach((el) => { el.hidden = isReport; });
  document.querySelectorAll("#page button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === pg)));
  if (isReport) { buildReport(); if (location.hash !== "#report") history.replaceState(null, "", "#report"); }
  else { if (location.hash) history.replaceState(null, "", location.pathname + location.search); render(); }
  save();
}
window.addEventListener("hashchange", () => showPage(location.hash === "#report" ? "report" : "compare"));

// ---------- Brand stress test + synced actions ----------
if (!state.brand) state.brand = { primary: "", font: "", density: "" };
const statusEl = document.getElementById("status");
function sendBrand() { frames().forEach((f) => post(f, { type: "lab:brand", brand: state.brand })); syncBrandUI(); save(); }
function syncBrandUI() {
  document.querySelectorAll("#swatches .sw").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.c || "") === (state.brand.primary || "") )));
  document.getElementById("font").value = state.brand.font || "";
  document.querySelectorAll("#density button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === (state.brand.density || ""))));
}
document.getElementById("swatches").addEventListener("click", (e) => {
  const b = e.target.closest(".sw"); if (!b) return;
  state.brand.primary = b.dataset.c || ""; sendBrand();
});
document.getElementById("primary-custom").addEventListener("input", (e) => { state.brand.primary = e.target.value; sendBrand(); });
document.getElementById("font").addEventListener("change", (e) => { state.brand.font = e.target.value; sendBrand(); });
document.getElementById("density").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.brand.density = b.dataset.v; sendBrand();
});

const pending = {};
function play(name) {
  const fs = frames();
  pending[name] = { want: fs.length, got: [] };
  fs.forEach((f) => post(f, { type: "lab:action", name }));
  statusEl.textContent = "";
}
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type !== "lab:action-result" || !pending[d.name]) return;
  const i = frames().findIndex((f) => f.contentWindow === e.source);
  pending[d.name].got.push({ i, ok: d.ok });
  const p = pending[d.name];
  if (p.got.length === p.want) {
    const missing = p.got.filter((g) => !g.ok).map((g) => byId(state.panes[g.i]).name);
    statusEl.textContent = missing.length ? "Not found in " + missing.join(" and ") : "";
    delete pending[d.name];
  }
});
document.getElementById("play").addEventListener("click", () => play(document.getElementById("action").value));
document.getElementById("close-all").addEventListener("click", () => play("close"));
let touring = false;
document.getElementById("tour").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget;
  if (touring) { touring = false; return; }
  touring = true; btn.textContent = "Stop";
  const steps = ["dialog", "close", "menu", "close", "sheet", "close", "command", "close", "task-add", "task-complete", "task-sort", "task-remove", "save-fail", "toast", "reload", "ledger-sort", "ledger-empty", "ledger-clear", "wizard-invalid", "wizard-fill", "wizard-next", "wizard-next", "wizard-cancel", "close"];
  const pause = (ms) => new Promise((r) => setTimeout(r, ms / Math.max(state.rate, 0.2) ** 0.5));
  for (const s of steps) {
    if (!touring) break;
    statusEl.textContent = "Tour: " + (document.querySelector('#action option[value="' + s + '"]')?.textContent || "close overlays");
    play(s);
    await pause(s === "close" ? 700 : 1500);
  }
  touring = false; btn.textContent = "Tour"; statusEl.textContent = "";
});
syncBrandUI();

showPage(location.hash === "#report" ? "report" : (state.page || "compare"));
</script>
