<title>UI System Lab Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool. A slim control bar on top, then one or two full-height frames of the same test page. */
:root {
  --bg: #eef0ef;
  --panel: #ffffff;
  --fg: #1b2120;
  --muted: #5f6a68;
  --line: #d7dcda;
  --accent: #1f6b64;
  --accent-fg: #ffffff;
  --chip: #e3e8e6;
  --warn: #b4441f;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --panel: #1a1f1e; --fg: #e6ebe9; --muted: #95a19e; --line: #2c3432;
    --accent: #5fbcb1; --accent-fg: #0d1514; --chip: #242b2a; --warn: #f0885e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1a1f1e; --fg: #e6ebe9; --muted: #95a19e; --line: #2c3432;
  --accent: #5fbcb1; --accent-fg: #0d1514; --chip: #242b2a; --warn: #f0885e; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px;
  display: flex; flex-direction: column;
}
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 600; font-size: 14px; margin-right: 4px; }
.group { display: flex; align-items: center; gap: 6px; }
.group > .lbl { color: var(--muted); }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  font: inherit; color: var(--muted); background: transparent; border: 0; border-radius: 6px;
  padding: 5px 10px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.seg button:focus-visible, select:focus-visible, .chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; max-width: 280px;
}
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.chk input { accent-color: var(--accent); }
.spacer { flex: 1; }
.keys { color: var(--muted); }
kbd {
  font-family: var(--font-ui); font-size: 11px; background: var(--chip); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 5px; color: var(--fg);
}
.stage {
  flex: 1; min-height: 0; display: grid; gap: 12px;
  padding-block: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.stage.split { grid-template-columns: 1fr 1fr; }
@media (max-width: 800px) { .stage.split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.pane-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pane-head strong { font-weight: 600; }
.pane-head span { color: var(--muted); }
.frame-wrap {
  flex: 1; min-height: 0; display: flex; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
iframe { border: 0; width: 100%; height: 100%; background: #fff; transition: width .2s ease; }
.frame-wrap.narrow iframe { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.empty {
  margin: auto; max-width: 42ch; text-align: center; color: var(--muted); padding: 24px; line-height: 1.5;
}
.empty strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 6px; }
.rate-on { color: var(--accent); font-weight: 500; }
@media (max-width: 1500px) { .keys { display: none; } }
.compare-only[hidden] { display: none !important; }
.bar2 { background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 8px; }
.swatches { display: inline-flex; gap: 4px; align-items: center; }
.sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.sw.none { background: conic-gradient(from 45deg, var(--line) 0 25%, var(--panel) 0 50%, var(--line) 0 75%, var(--panel) 0); }
.sw:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=color] { width: 24px; height: 22px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--panel); cursor: pointer; }
.btn { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.status { color: var(--muted); min-width: 0; }
@media (max-width: 800px) { .sep { display: none; } }

.report { flex: 1; min-height: 0; overflow-y: auto; }
.report-inner { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.report-inner > * { min-width: 0; }
.report h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
.report h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.report p { margin: 0; line-height: 1.55; }
.lede { font-size: 14px; max-width: 72ch; color: var(--fg); }
.sub { color: var(--muted); max-width: 72ch; line-height: 1.5; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
td.wrap { white-space: normal; min-width: 180px; max-width: 260px; line-height: 1.35; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--chip); }
tr.base td { color: var(--muted); }
.rank { color: var(--muted); width: 28px; }
.sys { font-weight: 500; }
.dots { display: inline-flex; gap: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--accent); }
.avg { font-weight: 600; }
.chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.bad { color: var(--warn); font-weight: 500; }
.groups { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.group-card { padding: 14px 16px; display: grid; gap: 6px; }
.group-card strong { font-weight: 600; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.card { padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card-head strong { font-size: 14px; font-weight: 600; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.45; }
.card .lbl2 { font-size: 12px; color: var(--muted); font-weight: 500; }
.card button.open { justify-self: start; font: inherit; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.card button.open:hover { border-color: var(--accent); }
.card button.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.links { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.links a, .ext { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
.links a:hover, .ext:hover { text-decoration-color: currentColor; }
.links a:focus-visible, .ext:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.score { display: inline-flex; white-space: nowrap; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.sbar { width: 34px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: inline-block; }
.sbar > span { display: block; height: 100%; background: var(--accent); }
.bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.mini { height: 6px; border-radius: 3px; background: var(--accent); opacity: .7; }
.mini.hot { background: var(--warn); opacity: .9; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* report-v2 */
.report-inner { max-width: 1440px; gap: 40px; }
.intro { display: grid; gap: 8px; }
.report h1 { font-size: 28px; letter-spacing: -0.01em; }
.lede { font-size: 15px; color: var(--muted); max-width: 70ch; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.takeaways { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.take { display: flex; gap: 14px; padding: 18px; align-items: flex-start; }
.take-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--chip); color: var(--accent); display: grid; place-items: center; flex: none; }
.take-k { font-size: 12px; color: var(--muted); font-weight: 500; }
.take-v { font-size: 17px; font-weight: 600; margin: 2px 0 6px; }
.setup { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1000px) { .setup { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .setup { grid-template-columns: 1fr; } }
.setup-card { padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.setup-head { display: flex; gap: 8px; align-items: center; color: var(--accent); }
.setup-head strong { color: var(--fg); font-weight: 600; font-size: 14px; }
.setup-card ul, .note-col ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; line-height: 1.45; }
.sec-head { display: grid; gap: 8px; margin-bottom: 12px; }
.sec-head h2 { margin: 0; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: 12px; }
.sc { display: inline-block; min-width: 38px; text-align: center; padding: 3px 8px; border-radius: 6px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.sc.up { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.sc.flat { background: var(--chip); color: var(--muted); }
.sc.down { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
table.scores td, table.scores th { padding: 12px 10px; }
td.ctr, th.ctr { text-align: center; }
.rk { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--chip); font-weight: 600; font-size: 12px; color: var(--fg); }
.rk.big { width: 34px; height: 34px; font-size: 15px; flex: none; }
.sys-cell .sys { font-size: 14px; }
.avg-cell { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.avg { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.sbar { width: 56px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: inline-block; }
.sbar > span { display: block; height: 100%; background: var(--accent); }
td.judges { color: var(--muted); font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 200px; max-width: 280px; line-height: 1.4; }
.tip { position: relative; cursor: help; border-bottom: 1px dotted var(--muted); outline: none; }
.tip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.tip::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; width: 240px; white-space: normal; text-align: left; padding: 8px 10px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 400; line-height: 1.4; box-shadow: 0 6px 20px rgb(0 0 0 / .18); opacity: 0; pointer-events: none; transform: translateY(-2px); transition: opacity .12s, transform .12s; }
.tip.tip-r::after { left: auto; right: 0; }
.tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: none; }
.tbl-wrap { padding-bottom: 2px; }
table.scores thead th, table.perf thead th { position: relative; }
.panel.tbl-wrap:has(.tip:hover), .panel.tbl-wrap:has(.tip:focus-visible) { overflow: visible; }
.groups { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.group-card { padding: 16px; gap: 10px; align-content: start; }
.group-head { display: flex; align-items: center; gap: 10px; }
.group-head strong { font-size: 14px; font-weight: 600; line-height: 1.3; }
.group-ico { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); display: grid; place-items: center; flex: none; }
.kind { font-size: 12px; color: var(--muted); }
.sys-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sys-chip { font: inherit; font-size: 12.5px; font-weight: 500; color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.sys-chip:hover { border-color: var(--accent); }
.sys-chip:focus-visible, .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.perf-note { display: grid; gap: 6px; max-width: 80ch; color: var(--muted); line-height: 1.5; }
.perf-note ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.notes { display: grid; gap: 14px; }
.note { padding: 20px 22px; display: grid; gap: 14px; }
.note-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.note-title { display: grid; gap: 6px; flex: 1; min-width: 220px; }
.nt-row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.nt-row strong { font-size: 17px; font-weight: 600; }
.note-scores { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.ns { display: grid; gap: 3px; justify-items: center; }
.ns-l { font-size: 11px; color: var(--muted); }
.verdict { font-size: 14px; max-width: 95ch; line-height: 1.55; }
.note-cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.note-col { border-radius: 10px; padding: 12px 14px; background: var(--bg); display: grid; gap: 8px; align-content: start; }
.note-col .lbl2 { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--fg); }
.note-col.look .ico { color: var(--accent); }
.note-col.prob .ico { color: var(--warn); }
.note-col.fix .ico { color: var(--muted); }
.note-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.open { font: inherit; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.open:hover { border-color: var(--accent); }
.note-title .chip { justify-self: start; }
.update-note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--fg); line-height: 1.5; max-width: 95ch; }
.update-note .ico { color: var(--accent); margin-top: 1px; }
/* /report-v2 */
</style>

<div class="bar" role="toolbar" aria-label="Comparison controls">
  <span class="brand">UI System Lab</span>

  <div class="seg" id="page">
    <button type="button" data-v="compare" aria-pressed="true">Compare</button>
    <button type="button" data-v="report" aria-pressed="false">Report</button>
    <button type="button" data-v="history" aria-pressed="false">History</button>
  </div>

  <div class="group compare-only">
    <span class="lbl">View</span>
    <div class="seg" id="mode">
      <button type="button" data-v="single" aria-pressed="true">Single</button>
      <button type="button" data-v="split" aria-pressed="false">Side by side</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Width</span>
    <div class="seg" id="width">
      <button type="button" data-v="fill" aria-pressed="true">Full</button>
      <button type="button" data-v="820" aria-pressed="false">Tablet</button>
      <button type="button" data-v="390" aria-pressed="false">Phone</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Theme</span>
    <div class="seg" id="theme">
      <button type="button" data-v="light" aria-pressed="true">Light</button>
      <button type="button" data-v="dark" aria-pressed="false">Dark</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Motion</span>
    <div class="seg" id="rate">
      <button type="button" data-v="1" aria-pressed="true">1×</button>
      <button type="button" data-v="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-v="0.2" aria-pressed="false">0.2×</button>
    </div>
  </div>

  <label class="chk compare-only"><input type="checkbox" id="sync" checked> Sync scroll</label>

  <span class="spacer"></span>
  <span class="keys compare-only"><kbd>1</kbd>–<kbd>9</kbd> variant · <kbd>S</kbd> split · <kbd>M</kbd> slow motion · <kbd>D</kbd> theme · <kbd>R</kbd> report</span>
</div>

<div class="bar bar2 compare-only" role="toolbar" aria-label="Brand stress test and synced actions">
  <div class="group">
    <span class="lbl">Primary</span>
    <div class="swatches" id="swatches">
      <button type="button" class="sw none" data-c="" aria-label="Each variant's own primary color" aria-pressed="true" title="Variant's own"></button>
      <button type="button" class="sw" data-c="#e8590c" style="background:#e8590c" aria-label="Orange" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#f5c400" style="background:#f5c400" aria-label="Yellow" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#2f9e44" style="background:#2f9e44" aria-label="Green" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#1c7ed6" style="background:#1c7ed6" aria-label="Blue" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#7048e8" style="background:#7048e8" aria-label="Violet" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#d6336c" style="background:#d6336c" aria-label="Pink" aria-pressed="false"></button>
      <input type="color" id="primary-custom" value="#0ca678" aria-label="Custom primary color" title="Custom color">
    </div>
  </div>
  <div class="group">
    <label class="lbl" for="font">Font</label>
    <select id="font">
      <option value="">Variant's own</option>
      <option value="inter">Inter</option>
      <option value="geist">Geist</option>
      <option value="plex">IBM Plex Sans</option>
      <option value="manrope">Manrope</option>
      <option value="dm-sans">DM Sans</option>
      <option value="source-serif">Source Serif 4</option>
    </select>
  </div>
  <div class="group">
    <span class="lbl">Density</span>
    <div class="seg" id="density">
      <button type="button" data-v="compact" aria-pressed="false">Compact</button>
      <button type="button" data-v="" aria-pressed="true">Default</button>
      <button type="button" data-v="comfortable" aria-pressed="false">Comfortable</button>
    </div>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <div class="group">
    <label class="lbl" for="action">Play in both</label>
    <select id="action">
      <optgroup label="Overlays">
        <option value="dialog">Open dialog (New project)</option>
        <option value="menu">Open project menu</option>
        <option value="sheet">Open side panel</option>
        <option value="popover">Open filter popover</option>
        <option value="combobox">Open people picker</option>
        <option value="command">Open command menu</option>
      </optgroup>
      <optgroup label="Lists">
        <option value="task-add">Add a task</option>
        <option value="task-complete">Complete first open task</option>
        <option value="task-move">Move first task down</option>
        <option value="task-sort">Toggle sort by due date</option>
        <option value="task-remove">Remove a task</option>
        <option value="tab">Next tab</option>
      </optgroup>
      <optgroup label="Table">
        <option value="ledger-sort">Sort by amount</option>
        <option value="ledger-next">Next page</option>
        <option value="ledger-filter">Search “north”</option>
        <option value="ledger-empty">Search with no results</option>
        <option value="ledger-clear">Clear filters</option>
      </optgroup>
      <optgroup label="Form">
        <option value="wizard-fill">Fill in a valid client</option>
        <option value="wizard-invalid">Enter a bad email</option>
        <option value="wizard-next">Next step</option>
        <option value="wizard-back">Previous step</option>
        <option value="wizard-cancel">Cancel with unsaved changes</option>
      </optgroup>
      <optgroup label="Feedback">
        <option value="toast">Show a toast</option>
        <option value="save-fail">Save that fails (then Retry)</option>

const state = { mode: "single", width: "fill", theme: "light", rate: 1, sync: true, panes: ["baseline", "kemiljk"], page: "compare", brand: { primary: "", font: "", density: "" }, active: 0, scroll: 0 };
try { Object.assign(state, JSON.parse(localStorage.getItem("uilab") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("uilab", JSON.stringify(state)); } catch (e) {} };

const stage = document.getElementById("stage");
const byId = (id) => VARIANTS.find((v) => v.id === id) || VARIANTS[0];

function frames() { return [...stage.querySelectorAll("iframe")]; }
function post(frame, msg) { try { frame.contentWindow.postMessage(msg, "*"); } catch (e) {} }

function render() {
  stage.className = "stage" + (state.mode === "split" ? " split" : "");
  stage.innerHTML = "";
  const count = state.mode === "split" ? 2 : 1;
  for (let i = 0; i < count; i++) stage.appendChild(makePane(i));
  syncSegs();
  save();
}

function makePane(i) {
  const v = byId(state.panes[i]);
  const pane = document.createElement("section");
  pane.className = "pane";

  const head = document.createElement("div");
  head.className = "pane-head";
  const sel = document.createElement("select");
  sel.id = "pick-" + i;
  sel.setAttribute("aria-label", i === 0 ? "Left variant" : "Right variant");
  VARIANTS.forEach((o, n) => {
    const opt = document.createElement("option");
    opt.value = o.id;
    opt.textContent = (n + 1) + ". " + o.name + (o.ready ? "" : " (not built)");
    if (o.id === v.id) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => { state.panes[i] = sel.value; state.active = i; render(); });
  sel.addEventListener("focus", () => { state.active = i; });
  const note = document.createElement("span");
  note.textContent = v.note;
  head.append(sel, note);

  const wrap = document.createElement("div");
  wrap.className = "frame-wrap" + (state.width !== "fill" ? " narrow" : "");
  if (v.ready) {
    const f = document.createElement("iframe");
    f.title = v.name;
    f.src = v.path + "?theme=" + state.theme;
    if (state.width !== "fill") f.style.width = state.width + "px";
    f.addEventListener("load", () => {
      post(f, { type: "lab:rate", rate: state.rate });
      post(f, { type: "lab:brand", brand: state.brand });
      setTimeout(() => post(f, { type: "lab:scroll", ratio: state.scroll }), 120);
    });
    wrap.appendChild(f);
  } else {
    wrap.innerHTML = '<div class="empty"><strong>' + v.name + ' isn’t built yet</strong>This variant will be the baseline page with ' + v.name + ' applied. Pick Baseline to see the starting point.</div>';
  }
  pane.append(head, wrap);
  return pane;
}

function syncSegs() {
  const vals = { mode: state.mode, width: String(state.width), theme: state.theme, rate: String(state.rate) };
  for (const [id, val] of Object.entries(vals)) {
    document.querySelectorAll("#" + id + " button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === val)));
  }
  document.getElementById("sync").checked = state.sync;
}

function setOpt(key, val) {
  state[key] = val;
  if (key === "mode" || key === "width") { render(); return; }
  if (key === "theme") frames().forEach((f) => post(f, { type: "lab:theme", theme: val }));
  if (key === "rate") frames().forEach((f) => post(f, { type: "lab:rate", rate: val }));
  syncSegs(); save();
}

document.querySelectorAll(".seg").forEach((seg) => {
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const v = b.dataset.v;
    if (seg.id === "page") { showPage(v); return; }
    setOpt(seg.id, seg.id === "rate" ? Number(v) : v);
  });
});
document.getElementById("sync").addEventListener("change", (e) => { state.sync = e.target.checked; save(); });

window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "lab:key") {
    const i = frames().findIndex((f) => f.contentWindow === e.source);
    if (i >= 0) state.active = i;
    onKey(d.key);
    return;
  }
  if (d.type !== "lab:scroll") return;
  state.scroll = d.ratio;
  if (!state.sync) return;
  frames().forEach((f) => { if (f.contentWindow !== e.source) post(f, d); });
});

// Shortcuts also work while a frame has focus: the bridge script inside each variant forwards them.
function onKey(key) {
  if (key === "r") { showPage(state.page === "report" ? "compare" : "report"); return; }
  if (state.page === "report") return;
  const n = Number(key);
  if (n >= 1 && n <= Math.min(9, VARIANTS.length)) {
    const target = state.mode === "split" ? state.active : 0;
    state.panes[target] = VARIANTS[n - 1].id;
    render();
  } else if (key === "s") setOpt("mode", state.mode === "split" ? "single" : "split");
  else if (key === "m") setOpt("rate", state.rate === 1 ? 0.2 : 1);
  else if (key === "d") setOpt("theme", state.theme === "dark" ? "light" : "dark");
}
window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  onKey(e.key);
});

 5, "interaction": 3, "accessibility": 4, "fidelity": 4, "productFit": 5, "performanceCost": 4}, "verdict": "This is the only variant with a real art direction: a tinted frame with a white sheet, a sidebar, IBM Plex, one teal data hue, pale status pills, a strip of KPI tiles and a two-column settings layout. Dark mode is equally coherent. The phone layout folds the nav into a working sheet. Motion was barely touched.", "bestFor": "giving a generic app a product identity", "highlights": ["Sidebar shell with a product mark and a framed sheet", "KPI strip with units as grey suffixes and the overdue note in red", "Underline tabs, people avatars tinted by hue, mono only for invoice IDs", "Phone: 2x2 KPI grid and a full-screen nav and search sheet"], "issues": ["Archived and Recent files cards leave large empty voids in the stretched row", "Ships about 580 KB of Plex font files (only the used subsets load)"], "effort": "large (30 files, +436/-218), adds @fontsource IBM Plex Sans and Mono"}, "skills": {"scores": {"visual": 3, "interaction": 4, "accessibility": 5, "fidelity": 4, "productFit": 5, "performanceCost": 5}, "verdict": "This was the most thorough accessibility pass. It uses a strong native-style focus outline, 3:1 input borders and fixed dark-mode destructive contrast. It adds a skip link, labels, live regions, and focus on the field after a failed submit (verified). The look is close to baseline, with slightly firmer borders and shadow-ring cards.", "bestFor": "an accessibility and copy hardening pass", "highlights": ["High-contrast black focus outline on every control", "Darker input, checkbox and switch borders", "Nav stays reachable on phone as a scrolling row", "Neutral 'Sign out', error toasts that stay, pluralised copy"], "issues": ["Billing email now validates only on submit, so the demo's inline error state is no longer visible on load"], "effort": "medium (28 files, +219/-125), no new deps"}, "ui-craft": {"scores": {"visual": 4, "interaction": 4, "access aint grey", "No reorder motion, so rows jump on sort and move (verified, deliberate)", "Focus falls to the page body after a keyboard Remove and after Retry (verified)"], "effort": "medium (r1: 22 files, +119/-55; r2 mostly classes and one keyframe), no new deps", "round2": "Rows enter and leave nicely but jump on sort and move, which is the main thing the list tests. Overlays got concentric radii, ring borders and shorter sheet timing. Async states are unchanged apart from a staggered reload; copy and focus handling stay at baseline.", "brand": "Follows the override fully with dark text on yellow buttons; the 3px focus ring becomes yellow at 50% alpha, about 1.3:1 on white."}, "magicui": {"scores": {"visual": 3, "interaction": 2, "accessibility": 3, "fidelity": 3, "productFit": 2, "performanceCost": 2}, "verdict": "The agent showed restraint and fixed both round-1 bugs: the number ticker now respects reduced motion and lower sections no longer stay invisible (both verified). Round 2 added a spring list with layout reorder, a shine border on the command menu and a ticking rate. But the list reorder ignores reduced motion, and the page now runs a requestAnimationFrame loop every frame at idle.", "bestFor": "a sparing accent on marketing-adjacent screens", "highlights": ["Number ticker on KPI values", "Cursor-following spotlight on project cards", "Blur-fade section reveals and a shimmer 'Thinking…'", "Round 2: rows spring in, scale out and slide neighbours on reorder", "Rate ticks back to $135 after a failed save, so the rollback is visible"], "issues": ["Number ticker counts KPIs up from 0 on every load (reduced motion now skips it, verified)", "Layout CPU 1,404 ms vs 198 ms in the round-2 benchmark", "Reorder still slides rows 100 px under prefers-reduced-motion (verified)", "A requestAnimationFrame loop runs 60 times per second at idle (verified), about 14% main thread", "Task list became role='list' divs to fit the motion wrapper"], "effort": "medium (r1: 9 files so g and p lose their descenders (verified)", "Reorder slides rows 72 px under prefers-reduced-motion although the notes say it drops the slide (verified)", "Primary buttons ignore --primary and stay black under a brand color (verified)", "Focus falls to the page body after a keyboard Remove (verified)"], "effort": "large (r1: 50 files, ~12k lines of library code; r2 installed command-menu, combobox and banner), adds motion, @base-ui/react, Inter variable, 11 Radix packages, pdfjs-dist", "round2": "The list has layout reorder and enter and exit motion, but titles are clipped and the motion ignores reduced motion. Overlays are its strongest part: a proper command menu and combobox, though sheet inputs are again borderless. Async states use banners with Retry and a width-stable loading button, which reads clearly.", "brand": "Follows only partly: progress bars, toggles and the 1 px focus ring turn yellow, but primary buttons keep Fluid's black, and the 1 px yellow ring is about 1.6:1 on white, so focus is nearly invisible."}, "libraries": {"scores": {"visual": 3, "interaction": 2, "accessibility": 3, "fidelity": 2, "productFit": 1, "performanceCost": 1}, "verdict": "Animated bot avatars, a thinking orb, a border beam, a voice glow, gooey tabs and WebGL loaders add novelty, not usability. Round 2 correctly found no fit for any effect and added only aria-busy, so the new sections behave like baseline. The round-1 cost remains: idle main thread about 68% busy, TBT 19 s and p95 frames 67 ms under the throttled benchmark.", "bestFor": "AI-product demos, not work tools", "highlights": ["Animated clover bot avatars in chat", "Border beam on the composer while waiting", "Gooey liquid tab indicator", "Round 2: declined to force effects onto the new sections, with reasons per package"], "issues": ["Reply delay doubled to 3.2 s to fit the effect rules", "First tab click took 17 s in unthrottled headless Chromium (no GPU)", "Bundle ~400 KB gzipped (2.8x), mostly three.js for 40 px loader tiles", "New sections have baseline behavior: no list motion, focus to body after Remove and Retry (verified)"], "effort": "small code change (r1: 7 files, +164/-17; r2 one attribute), adds seven effect packages and three.js", "round2": "The list, overlays and async states are stock baseline apart from aria-busy on reload, because no effect matched the skill's rules. That restraint is correct, but it leaves the variant with all of round 1's runtime cost and none of the round-2 gains.", "brand": "Follows the override fully with dark text on yellow buttons; the 3px focus ring becomes yellow at 50% alpha, about 1.3:1 on white."}}, "changes": "Round 2 rewarded behavior over looks: better-interface moved from third to second because it verified best on reorder motion, focus restoration and the brand test, and taste dropped to third because focus falls to the page body after Remove and Retry. userinterface.wiki and ibelick each rose one place for View Transition reorders and focus handling, while feel-better fell two because rows still jump on sort and focus is not managed. Magic UI moved above Fluid after fixing both round-1 bugs, while Fluid gained clipped task titles, a reduced-motion leak and primary buttons that ignore the brand color. ui-craft kept fourth but paid for Motion with a third more JS and its own reduced-motion leak."}};
function buildHistory() {
  const el = document.getElementById("history-inner");
  if (el.dataset.built) return; el.dataset.built = "1";
  const rounds = [["Round 1: original page", HISTORY.r1], ["Round 2: task list, overlays, sync", HISTORY.r2]];
  let h = '<section><h1>History</h1><p class="sub">Private notes. Earlier reviews by a single informed reviewer, kept for reference. The public Report shows only the final blind-panel results. For the real-device benchmark, open this page with #bench.</p></section>';
  rounds.forEach(([title, r]) => {
    h += '<section class="panel" style="padding:18px 20px;display:grid;gap:10px"><h2>' + esc(title) + '</h2><p>' + esc(r.summary) + '</p>' + (r.changes ? '<p class="sub">' + esc(r.changes) + '</p>' : '') +
      '<p class="sub">Ranking: ' + r.ranking.map((id, i) => (i + 1) + '. ' + esc(nameOf(id))).join(', ') + '</p>' +
      r.ranking.map((id) => { const x = r.systems[id]; return '<details><summary><strong>' + esc(nameOf(id)) + '</strong></summary><div style="display:grid;gap:6px;padding:8px 0 4px 16px"><p>' + esc(x.verdict) + '</p>' + (x.round2 ? '<p><span class="lbl2">Round 2</span> ' + esc(x.round2) + '</p>' : '') + (x.brand ? '<p><span class="lbl2">Brand test</span> ' + esc(x.brand) + '</p>' : '') + (x.issues && x.issues.length ? '<ul>' + x.issues.map((i) => '<li>' + esc(i) + '</li>').join('') + '</ul>' : '') + '</div></details>'; }).join('') + '</section>';
  });
  el.innerHTML = h;
}

function openCompare(id) {
  state.mode = id === "baseline" ? "single" : "split";
  state.panes = id === "baseline" ? ["baseline", state.panes[1]] : ["baseline", id];
  showPage("compare");
}

function showPage(pg) {
  state.page = pg;
  const isReport = pg === "report", isHist = pg === "history";
  reportEl.hidden = !isReport;
  document.getElementById("history").hidden = !isHist;
  stage.hidden = isReport || isHist;
  document.querySelectorAll(".compare-only").forEach((el) => { el.hidden = isReport || isHist; });
  document.querySelectorAll("#page button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === pg)));
  if (isReport) { buildReport(); if (location.hash !== "#report") history.replaceState(null, "", "#report"); }
  else if (isHist) { buildHistory(); if (location.hash !== "#history") history.replaceState(null, "", "#history"); }
  else { if (location.hash) history.replaceState(null, "", location.pathname + location.search); render(); }
  save();
}
window.addEventListener("hashchange", () => showPage(location.hash === "#report" ? "report" : location.hash === "#history" ? "history" : "compare"));

// ---------- Brand stress test + synced actions ----------
if (!state.brand) state.brand = { primary: "", font: "", density: "" };
const statusEl = document.getElementById("status");
function sendBrand() { frames().forEach((f) => post(f, { type: "lab:brand", brand: state.brand })); syncBrandUI(); save(); }
function syncBrandUI() {
  document.querySelectorAll("#swatches .sw").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.c || "") === (state.brand.primary || "") )));
  document.getElementById("font").value = state.brand.font || "";
  document.querySelectorAll("#density button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === (state.brand.density || ""))));
}
document.getElementById("swatches").addEventListener("click", (e) => {
  const b = e.target.closest(".sw"); if (!b) return;
  state.brand.primary = b.dataset.c || ""; sendBrand();
});
document.getElementById("primary-custom").addEventListener("input", (e) => { state.brand.primary = e.target.value; sendBrand(); });
document.getElementById("font").addEventListener("change", (e) => { state.brand.font = e.target.value; sendBrand(); });
document.getElementById("density").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.brand.density = b.dataset.v; sendBrand();
});

const pending = {};
function play(name) {
  const fs = frames();
  pending[name] = { want: fs.length, got: [] };
  fs.forEach((f) => post(f, { type: "lab:action", name }));
  statusEl.textContent = "";
}
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type !== "lab:action-result" || !pending[d.name]) return;
  const i = frames().findIndex((f) => f.contentWindow === e.source);
  pending[d.name].got.push({ i, ok: d.ok });
  const p = pending[d.name];
  if (p.got.length === p.want) {
    const missing = p.got.filter((g) => !g.ok).map((g) => byId(state.panes[g.i]).name);
    statusEl.textContent = missing.length ? "Not found in " + missing.join(" and ") : "";
    delete pending[d.name];
  }
});
document.getElementById("play").addEventListener("click", () => play(document.getElementById("action").value));
document.getElementById("close-all").addEventListener("click", () => play("close"));
let touring = false;
document.getElementById("tour").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget;
  if (touring) { touring = false; return; }
  touring = true; btn.textContent = "Stop";
  const steps = ["dialog", "close", "menu", "close", "sheet", "close", "command", "close", "task-add", "task-complete", "task-sort", "task-remove", "save-fail", "toast", "reload", "ledger-sort", "ledger-empty", "ledger-clear", "wizard-invalid", "wizard-fill", "wizard-next", "wizard-next", "wizard-cancel", "close"];
  const pause = (ms) => new Promise((r) => setTimeout(r, ms / Math.max(state.rate, 0.2) ** 0.5));
  for (const s of steps) {
    if (!touring) break;
    statusEl.textContent = "Tour: " + (document.querySelector('#action option[value="' + s + '"]')?.textContent || "close overlays");
    play(s);
    await pause(s === "close" ? 700 : 1500);
  }
  touring = false; btn.textContent = "Tour"; statusEl.textContent = "";
});
syncBrandUI();

if (!window.__BENCH) showPage(location.hash === "#report" ? "report" : location.hash === "#history" ? "history" : (state.page || "compare"));
</script>

<script>
// Real-device benchmark, run inside the artifact frame so variants are same-origin.
// Open the page with #bench. Results render as a table and as JSON.
(function () {
  if (!window.__BENCH) return;
  const IDS = ["baseline","fluid","skills","feel-better","libraries","ui-craft","taste","uiwiki","ibelick","emil","kemiljk","magicui"];
  const ACTIONS = ["dialog","close","menu","close","tab","toast","task-add","task-complete","task-sort","task-remove","sheet","close","command","close","combobox","close","save-fail","offline","offline","reload","ledger-sort","ledger-next","ledger-filter","ledger-empty","ledger-clear","wizard-invalid","wizard-fill","wizard-next","wizard-next","wizard-cancel","close"];
  const PASSES = 2;
  const T0 = performance.now(); const phase = (t) => { const el = document.getElementById("bstat"); if (el) el.textContent = t + " @ " + Math.round((performance.now() - T0) / 1000) + "s"; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  document.body.innerHTML = '<div style="font:13px system-ui;padding:16px;display:grid;gap:12px"><div style="display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#fff;padding:6px 0;z-index:9"><button id="brun" style="font:inherit;padding:6px 12px">Run benchmark (about 10 minutes)</button><button id="bcopy" hidden style="font:inherit;padding:6px 12px">Copy results</button><b id="bstat">Keep this window in front while it runs. Background tabs are throttled and give wrong numbers.</b></div><div id="bwrap" style="width:1280px;height:900px;border:1px solid #ccc;overflow:hidden"></div><pre id="bout" style="white-space:pre-wrap;font:12px ui-monospace,monospace"></pre></div>';
  const stat = document.getElementById("bstat"), wrap = document.getElementById("bwrap"), out = document.getElementById("bout");
  const med = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor((s.length - 1) / 2)] : null; };
  const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.min(s.length - 1, Math.floor(s.length * p))] : null; };

  async function runOne(id) {
    wrap.innerHTML = "";
    const f = document.createElement("iframe");
    f.style.cssText = "width:1280px;height:900px;border:0";
    const t0 = performance.now();
    const loaded = new Promise((r) => f.addEventListener("load", r, { once: true }));
    f.src = "variants/" + id + "/index.html";
    wrap.appendChild(f);
    phase(id + " loading"); await loaded;
    phase(id + " loaded");
    const w = f.contentWindow;
    const lab = { lcp: 0, cls: 0, long: [] };
    try {
      new w.PerformanceObserver((l) => l.getEntries().forEach((e) => (lab.lcp = e.startTime))).observe({ type: "largest-contentful-paint", buffered: true });
      new w.PerformanceObserver((l) => l.getEntries().forEach((e) => { if (!e.hadRecentInput) lab.cls += e.value; })).observe({ type: "layout-shift", buffered: true });
      new w.PerformanceObserver((l) => l.getEntries().forEach((e) => lab.long.push([e.startTime, e.duration]))).observe({ type: "longtask", buffered: true });
    } catch (e) {}
    await wait(2500);
    const nav = w.performance.getEntriesByType("navigation")[0] || {};
    const tbt = lab.long.reduce((a, [, d]) => a + Math.max(0, d - 50), 0);
    phase(id + " idle");
    // Idle: 4 s with nothing happening. Count parent frames and child long tasks.
    lab.long = [];
    let frames = [], last = performance.now(), stop = false;
    const tick = (t) => { frames.push(t - last); last = t; if (!stop) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    const idleStart = performance.now();
    // Busy probe: how much of each 100 ms slice a setTimeout chain is delayed.
    let lag = 0, probes = 0;
    while (performance.now() - idleStart < 4000) { const s = performance.now(); await wait(20); lag += Math.max(0, performance.now() - s - 20); probes++; }
    stop = true;
    const idleLong = lab.long.reduce((a, [, d]) => a + d, 0);
    const idleLagPct = (lag / 4000) * 100;
    const idleAnims = w.document.getAnimations ? w.document.getAnimations().filter((a) => a.playState === "running").length : 0;
    // Interactions: measure action → next painted frame, and frame times throughout.
    lab.long = []; frames = []; last = performance.now(); stop = false;
    requestAnimationFrame(tick);
    const lat = [];
    phase(id + " actions");
    for (const a of ACTIONS) {
      const s = performance.now();
      w.postMessage({ type: "lab:action", name: a }, "*");
      await Promise.race([new Promise((r) => w.requestAnimationFrame(() => w.requestAnimationFrame(r))), wait(1000)]);
      lat.push(performance.now() - s);
      await wait(a === "close" ? 300 : 500);
    }
    stop = true;
    const fr = frames.slice(1);
    return {
      id, load: Math.round(performance.now() - t0 - 2500), dcl: Math.round(nav.domContentLoadedEventEnd || 0), lcp: Math.round(lab.lcp), cls: +lab.cls.toFixed(3), tbt: Math.round(tbt),
      idleLongMs: Math.round(idleLong), idleLagPct: +idleLagPct.toFixed(1), idleAnims,
      actP50: Math.round(med(lat)), actP95: Math.round(pct(lat, 0.95)), actMax: Math.round(Math.max(...lat)),
      frameP95: +pct(fr, 0.95).toFixed(1), dropped: +((fr.filter((x) => x > 20).length / fr.length) * 100).toFixed(1),
      longMs: Math.round(lab.long.reduce((a, [, d]) => a + d, 0)),
    };
  }

  async function runAll() {
    const all = {};
    let throttled = 0;
    for (let p = 0; p < PASSES; p++) {
      for (const id of IDS) {
        phase("Pass " + (p + 1) + "/" + PASSES + ": " + id + " (keep this window in front)");
        const s = performance.now(); await wait(100); if (performance.now() - s > 400) throttled++;
        try { (all[id] ||= []).push(await runOne(id)); } catch (e) { (all[id] ||= []).push({ id, error: String(e) }); }
      }
    }
    const keys = ["load","dcl","lcp","cls","tbt","idleLongMs","idleLagPct","idleAnims","actP50","actP95","actMax","frameP95","dropped","longMs"];
    const res = IDS.map((id) => { const r = { id }; keys.forEach((k) => (r[k] = med(all[id].map((x) => x[k]).filter((v) => v != null)))); return r; });
    const bad = throttled > 0 || res.some((r) => r.idleLagPct > 50 || r.actMax > 5000);
    wrap.innerHTML = "";
    const env = { cores: navigator.hardwareConcurrency, mem: navigator.deviceMemory || null, ua: navigator.userAgent, gpu: (() => { try { const c = document.createElement("canvas").getContext("webgl"); const d = c.getExtension("WEBGL_debug_renderer_info"); return c.getParameter(d.UNMASKED_RENDERER_WEBGL); } catch (e) { return null; } })(), throttled: bad };
    const payload = JSON.stringify({ env, results: res });
    document.getElementById("bstat").textContent = bad ? "Finished, but the page was throttled (window in the background). Run again with this window in front." : "Finished. Click Copy results and paste them into the chat.";
    out.textContent = "id | " + keys.join(" | ") + "\n" + res.map((r) => [r.id, ...keys.map((k) => r[k])].join(" | ")).join("\n") + "\n\n" + payload;
    const btn = document.getElementById("bcopy"); btn.hidden = false;
    btn.onclick = async () => { try { await navigator.clipboard.writeText(payload); btn.textContent = "Copied"; } catch (e) { const r = document.createRange(); r.selectNodeContents(out); getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = "Select-all done, press ⌘C"; } };
    document.title = "BENCH DONE";
  }
  document.getElementById("brun").onclick = (e) => { e.target.disabled = true; runAll(); };
})();
</script>
