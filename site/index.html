<title>UI System Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool. A slim control bar on top, then one or two full-height frames of the same test page. */
:root {
  --bg: #eef0ef;
  --panel: #ffffff;
  --fg: #1b2120;
  --muted: #5f6a68;
  --line: #d7dcda;
  --accent: #1f6b64;
  --accent-fg: #ffffff;
  --chip: #e3e8e6;
  --warn: #b4441f;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --panel: #1a1f1e; --fg: #e6ebe9; --muted: #95a19e; --line: #2c3432;
    --accent: #5fbcb1; --accent-fg: #0d1514; --chip: #242b2a; --warn: #f0885e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1a1f1e; --fg: #e6ebe9; --muted: #95a19e; --line: #2c3432;
  --accent: #5fbcb1; --accent-fg: #0d1514; --chip: #242b2a; --warn: #f0885e; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px;
  display: flex; flex-direction: column;
}
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 600; font-size: 14px; margin-right: 4px; }
.group { display: flex; align-items: center; gap: 6px; }
.group > .lbl { color: var(--muted); }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  font: inherit; color: var(--muted); background: transparent; border: 0; border-radius: 6px;
  padding: 5px 10px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.seg button:focus-visible, select:focus-visible, .chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; max-width: 280px;
}
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.chk input { accent-color: var(--accent); }
.spacer { flex: 1; }
.keys { color: var(--muted); }
kbd {
  font-family: var(--font-ui); font-size: 11px; background: var(--chip); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 5px; color: var(--fg);
}
.stage {
  flex: 1; min-height: 0; display: grid; gap: 12px;
  padding-block: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.stage.split { grid-template-columns: 1fr 1fr; }
@media (max-width: 800px) { .stage.split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.pane-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pane-head strong { font-weight: 600; }
.pane-head span { color: var(--muted); }
.frame-wrap {
  flex: 1; min-height: 0; display: flex; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
iframe { border: 0; width: 100%; height: 100%; background: #fff; transition: width .2s ease; }
.frame-wrap.narrow iframe { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.empty {
  margin: auto; max-width: 42ch; text-align: center; color: var(--muted); padding: 24px; line-height: 1.5;
}
.empty strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 6px; }
.rate-on { color: var(--accent); font-weight: 500; }
@media (max-width: 1500px) { .keys { display: none; } }
.compare-only[hidden] { display: none !important; }
.bar2 { background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 8px; }
.swatches { display: inline-flex; gap: 4px; align-items: center; }
.sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.sw.none { background: conic-gradient(from 45deg, var(--line) 0 25%, var(--panel) 0 50%, var(--line) 0 75%, var(--panel) 0); }
.sw:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=color] { width: 24px; height: 22px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--panel); cursor: pointer; }
.btn { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.status { color: var(--muted); min-width: 0; }
@media (max-width: 800px) { .sep { display: none; } }

.report { flex: 1; min-height: 0; overflow-y: auto; }
.report-inner { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.report h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
.report h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.report p { margin: 0; line-height: 1.55; }
.lede { font-size: 14px; max-width: 72ch; color: var(--fg); }
.sub { color: var(--muted); max-width: 72ch; line-height: 1.5; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--chip); }
tr.base td { color: var(--muted); }
.rank { color: var(--muted); width: 28px; }
.sys { font-weight: 500; }
.dots { display: inline-flex; gap: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--accent); }
.avg { font-weight: 600; }
.chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.bad { color: var(--warn); font-weight: 500; }
.groups { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.group-card { padding: 14px 16px; display: grid; gap: 6px; }
.group-card strong { font-weight: 600; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.card { padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card-head strong { font-size: 14px; font-weight: 600; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.45; }
.card .lbl2 { font-size: 12px; color: var(--muted); font-weight: 500; }
.card button.open { justify-self: start; font: inherit; background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.card button.open:hover { border-color: var(--accent); }
.card button.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.links { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.links a, .ext { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
.links a:hover, .ext:hover { text-decoration-color: currentColor; }
.links a:focus-visible, .ext:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.mini { height: 6px; border-radius: 3px; background: var(--accent); opacity: .7; }
.mini.hot { background: var(--warn); opacity: .9; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar" role="toolbar" aria-label="Comparison controls">
  <span class="brand">UI System Lab</span>

  <div class="seg" id="page">
    <button type="button" data-v="compare" aria-pressed="true">Compare</button>
    <button type="button" data-v="report" aria-pressed="false">Report</button>
  </div>

  <div class="group compare-only">
    <span class="lbl">View</span>
    <div class="seg" id="mode">
      <button type="button" data-v="single" aria-pressed="true">Single</button>
      <button type="button" data-v="split" aria-pressed="false">Side by side</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Width</span>
    <div class="seg" id="width">
      <button type="button" data-v="fill" aria-pressed="true">Full</button>
      <button type="button" data-v="820" aria-pressed="false">Tablet</button>
      <button type="button" data-v="390" aria-pressed="false">Phone</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Theme</span>
    <div class="seg" id="theme">
      <button type="button" data-v="light" aria-pressed="true">Light</button>
      <button type="button" data-v="dark" aria-pressed="false">Dark</button>
    </div>
  </div>

  <div class="group compare-only">
    <span class="lbl">Motion</span>
    <div class="seg" id="rate">
      <button type="button" data-v="1" aria-pressed="true">1×</button>
      <button type="button" data-v="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-v="0.2" aria-pressed="false">0.2×</button>
    </div>
  </div>

  <label class="chk compare-only"><input type="checkbox" id="sync" checked> Sync scroll</label>

  <span class="spacer"></span>
  <span class="keys compare-only"><kbd>1</kbd>–<kbd>9</kbd> variant · <kbd>S</kbd> split · <kbd>M</kbd> slow motion · <kbd>D</kbd> theme · <kbd>R</kbd> report</span>
</div>

<div class="bar bar2 compare-only" role="toolbar" aria-label="Brand stress test and synced actions">
  <div class="group">
    <span class="lbl">Primary</span>
    <div class="swatches" id="swatches">
      <button type="button" class="sw none" data-c="" aria-label="Each variant's own primary color" aria-pressed="true" title="Variant's own"></button>
      <button type="button" class="sw" data-c="#e8590c" style="background:#e8590c" aria-label="Orange" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#f5c400" style="background:#f5c400" aria-label="Yellow" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#2f9e44" style="background:#2f9e44" aria-label="Green" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#1c7ed6" style="background:#1c7ed6" aria-label="Blue" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#7048e8" style="background:#7048e8" aria-label="Violet" aria-pressed="false"></button>
      <button type="button" class="sw" data-c="#d6336c" style="background:#d6336c" aria-label="Pink" aria-pressed="false"></button>
      <input type="color" id="primary-custom" value="#0ca678" aria-label="Custom primary color" title="Custom color">
    </div>
  </div>
  <div class="group">
    <label class="lbl" for="font">Font</label>
    <select id="font">
      <option value="">Variant's own</option>
      <option value="inter">Inter</option>
      <option value="geist">Geist</option>
      <option value="plex">IBM Plex Sans</option>
      <option value="manrope">Manrope</option>
      <option value="dm-sans">DM Sans</option>
      <option value="source-serif">Source Serif 4</option>
    </select>
  </div>
  <div class="group">
    <span class="lbl">Density</span>
    <div class="seg" id="density">
      <button type="button" data-v="compact" aria-pressed="false">Compact</button>
      <button type="button" data-v="" aria-pressed="true">Default</button>
      <button type="button" data-v="comfortable" aria-pressed="false">Comfortable</button>
    </div>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <div class="group">
    <label class="lbl" for="action">Play in both</label>
    <select id="action">
      <optgroup label="Overlays">
        <option value="dialog">Open dialog (New project)</option>
        <option value="menu">Open project menu</option>
        <option value="sheet">Open side panel</option>
        <option value="popover">Open filter popover</option>
        <option value="combobox">Open people picker</option>
        <option value="command">Open command menu</option>
      </optgroup>
      <optgroup label="Lists">
        <option value="task-add">Add a task</option>
        <option value="task-complete">Complete first open task</option>
        <option value="task-move">Move first task down</option>
        <option value="task-sort">Toggle sort by due date</option>
        <option value="task-remove">Remove a task</option>
        <option value="tab">Next tab</option>
      </optgroup>
      <optgroup label="Table">
        <option value="ledger-sort">Sort by amount</option>
        <option value="ledger-next">Next page</option>
        <option value="ledger-filter">Search “north”</option>
        <option value="ledger-empty">Search with no results</option>
        <option value="ledger-clear">Clear filters</option>
      </optgroup>
      <optgroup label="Form">
        <option value="wizard-fill">Fill in a valid client</option>
        <option value="wizard-invalid">Enter a bad email</option>
        <option value="wizard-next">Next step</option>
        <option value="wizard-back">Previous step</option>
        <option value="wizard-cancel">Cancel with unsaved changes</option>
      </optgroup>
      <optgroup label="Feedback">
        <option value="toast">Show a toast</option>
        <option value="save-fail">Save that fails (then Retry)</option>
        <option value="retry">Retry</option>
        <option value="offline">Toggle offline</option>
        <option value="reload">Reload entries</option>
      </optgroup>
    </select>
    <button type="button" class="btn primary" id="play">Play</button>
    <button type="button" class="btn" id="close-all">Close</button>
    <button type="button" class="btn" id="tour">Tour</button>
  </div>
  <span class="status" id="status" role="status"></span>
</div>
<div class="stage" id="stage"></div>
<div class="report" id="report" hidden><div class="report-inner" id="report-inner"></div></div>

const REVIEW = {"summary": "The rule-based skills still gave the best results for the lowest cost. Round 2 tested list motion, overlays and honest async feedback, and the behavior-focused skills did best there. kemiljk remains first: it again turned fake interactions into real ones and handled every list change with View Transitions and managed focus. Krehel's better-interface moves to second because it added list motion, restored focus everywhere a control disappears, and kept a black focus outline that survives a brand color. taste-skill is still the only variant with a distinct visual identity and carried it well into the new sections, but its focus handling is weaker. Most variants now animate list reorders, but Fluid, Magic UI and ui-craft use Motion layout animations that ignore reduced motion. The brand test showed a shared weakness: almost every variant draws focus from --ring, so a yellow brand turns focus into a 1.3:1 to 1.6:1 ring. The libraries still scored worst. A sensible stack is taste-skill for look plus kemiljk or better-interface for behavior, with emil's timing rules for motion.", "ranking": ["kemiljk", "skills", "taste", "ui-craft", "emil", "uiwiki", "ibelick", "feel-better", "magicui", "fluid", "libraries"], "groups": [{"label": "Rule skills: visual direction", "ids": ["taste", "ui-craft"], "note": "Change tokens, type and surfaces. taste rebuilds the shell. ui-craft is a lighter brand and elevation pass."}, {"label": "Rule skills: behavior and accessibility", "ids": ["kemiljk", "skills", "ibelick"], "note": "Little visible change. They fix semantics, labels, focus, honest feedback and broken interactions. Near-zero performance cost."}, {"label": "Rule skills: motion and polish", "ids": ["emil", "feel-better", "uiwiki"], "note": "Easing, press states, exit timing and hit areas. The page looks like baseline and feels better when you use it."}, {"label": "Component library", "ids": ["fluid"], "note": "Swaps most shadcn parts for its own. You get its whole look and motion model, and the regressions that come with it, plus a large bundle."}, {"label": "Effect packs", "ids": ["magicui", "libraries"], "note": "Layer animated effects on top of shadcn. They fit landing pages better than a daily work tool. Both cost the most runtime of any variant."}], "systems": {"baseline": {"scores": {"visual": 3, "interaction": 3, "accessibility": 3, "fidelity": 3, "productFit": 3, "performanceCost": 5}, "verdict": "This is stock shadcn/ui: clean and neutral, with no product identity. Focus rings are a 50% grey (about 1.5:1). Several actions are fake: Undo, Rename and Discard do nothing, and New project only shows a toast.", "bestFor": "reference point", "highlights": ["Grey translucent focus ring on every control", "Solid black 'Done' badge is the loudest status on the page"], "issues": ["New project toast says the project was added, but the card count stays at 6 (verified)", "Archive's Undo is a no-op (verified)", "Round 2: focus falls to the page body after a keyboard Remove and after Retry (verified)", "Reload has no aria-busy while the skeleton shows (verified)"], "effort": "none", "round2": "Tasks add, complete, move, sort and remove with a working Undo, but rows jump into place with no motion. Overlays are stock shadcn with stock 500 ms sheet timing. Save rolls back and Retry succeeds (verified 135, 145, 135, then 145), but focus drops to the body after Remove and Retry.", "brand": "Follows the override fully: primary buttons turn yellow with #111 text (11.5:1) and compact density shrinks buttons from 36 to 29 px, but the 3px focus ring becomes yellow at 50% alpha, about 1.3:1 on white."}, "kemiljk": {"scores": {"visual": 4, "interaction": 5, "accessibility": 5, "fidelity": 5, "productFit": 5, "performanceCost": 4}, "verdict": "This variant still made the most real improvement to the product, with almost no visual drama. Round 1 made fake interactions real. Round 2 did the same for the new sections: the filter now edits a draft that Apply commits, the side panel really renames the project, two command items go somewhere, and a false 'Applies to the project grid' line was removed. List changes run through View Transitions, focus is managed after every change, and reduced motion is respected (all verified).", "bestFor": "making an existing app honest and accessible", "highlights": ["New project, Duplicate, Archive with working Undo, using View Transitions", "Status badges by urgency: amber At risk, soft green Done, red Overdue figure", "Blue 2px focus ring; focus moves to the name field on a dialog error", "Unread count visible on the bell, a '/' search hint, and tab counts", "Round 2: every task change animates through View Transitions; none run under reduced motion (verified)", "Focus goes to the neighbouring row's checkbox after a keyboard Remove and to Raise after Retry (verified)", "Side panel edits a draft that Save commits and Cancel discards; empty name shows an inline error"], "issues": ["Visual change is modest: still recognisably shadcn", "Content copy was edited (card descriptions, subtitle), so it is not a pure UI comparison", "Project cards keep their round-1 view-transition names, so every task change also snapshots the project grid (verified); long tasks 2.1 s vs 1.2 s and p95 frame 33 ms vs 17 ms in the benchmark", "Its blue focus ring comes from --ring, so a brand color replaces it"], "effort": "large (r1: 17 files, +569/-234; r2 rewrote the three sections), no new deps", "round2": "The best round-2 behavior. Moves, sorts, adds and removes animate through View Transitions with focus kept on a sensible control, and moving while sorted now acts on the visible order. Overlays and async states were made honest: drafts commit or discard as labelled, the error names both the attempted and the current rate, and offline copy says changes are kept on the device.", "brand": "Follows the override (yellow buttons with dark text, buttons 36 to 29 px, card padding 20 to 16 px), d-submitted tasks. Popovers grow from their trigger and the command menu is instant. Async states fade in and the error explains the rollback, but Retry leaves focus on the body.", "brand": "Follows the override fully with dark text on yellow buttons, and the 3px focus ring becomes yellow at 50% alpha, about 1.3:1 on white since emil never strengthened the ring."}, "uiwiki": {"scores": {"visual": 3, "interaction": 4, "accessibility": 3, "fidelity": 4, "productFit": 4, "performanceCost": 4}, "verdict": "This variant applies rules on timing and touch targets, plus opt-in synthesized UI sounds. Round 2 drives every list change through native View Transitions (verified) with a quicker ease-in exit, opens the command menu instantly and adds sounds to save results. It looks almost the same as baseline, and focus is not restored when controls disappear.", "bestFor": "timing rules and optional sound feedback", "highlights": ["'Interface sounds' switch, off by default (verified)", "Dropdown menus with no entrance animation and an ease-in exit", "Six-layer button shadow on primary and destructive", "Save button width animates between labels", "Round 2: View Transitions for add, remove, move and sort; skipped under reduced motion (verified)", "Sheet cut to 250 ms in and 200 ms out"], "issues": ["Focus ring left at baseline's faint grey", "Focus falls to the page body after a keyboard Remove and after Retry (verified)", "Long tasks 2.6 s vs 1.2 s and style recalculation 3.5 s vs 2.0 s in the round-2 benchmark"], "effort": "medium (r1: 25 files, +255/-53; r2 added a view-transition helper), no new deps", "round2": "List reorder, entry and exit run through View Transitions with names cleaned up afterwards, which is a cheap way to get real list motion. Overlays got correct ease-in exits and an instant command menu. Async states fade in and play optional sounds, but there is no aria-busy on reload and focus drops after Remove and Retry.", "brand": "Follows the override fully with dark text on yellow buttons; the 3px focus ring becomes yellow at 50% alpha, about 1.3:1 on white."}, "ibelick": {"scores": {"visual": 3, "interaction": 3, "accessibility": 4, "fidelity": 4, "productFit": 4, "performanceCost": 5}, "verdict": "A hygiene pass that is solid but invisible. Round 2 continued it: per-row button names, a live region for list changes, focus kept on a sensible control after Move and Remove (verified), fieldsets in the filter and aria-busy on reload. It added no list motion on purpose, and Retry still drops focus.", "bestFor": "a quick checklist clean-up of shadcn defaults", "highlights": ["Delete opens a confirm AlertDialog", "Real h2 card titles, list markup and a chat log region", "Subtitle copy corrected to '4 in progress'", "Round 2: focus moves to the next row's Remove after a keyboard Remove (verified)", "Sr-only status announces added, removed, restored and moved tasks"], "issues": ["Focus ring left at baseline's faint grey despite the a11y pass", "Accordion now pops open with a fade instead of expanding", "No motion at all in the task list, so rows jump on sort and move (verified)", "Focus falls to the page body after Retry (verified)"], "effort": "small (r1: 19 files, +156/-79; r2 mostly attributes and classes), no new deps", "round2": "The list has no motion by design, but its keyboard and screen-reader behavior is good. Overlays got labels, fieldsets and reduced-motion opt-outs. Async states set aria-busy and link the error to the button, but focus is not returned after Retry.", "brand": "Follows the override fully with dark text on yellow buttons; the 3px focus ring becomes yellow at 50% alpha, about 1.3:1 on white."}, "feel-better": {"scores": {"visual": 3, "interaction": 4, "accessibility": 3, "fidelity": 4, "productFit": 4, "performanceCost": 4}, "verdict": "Many small details: press scale, a Like icon cross-fade, an interruptible grid-rows accordion, blur-rise dialogs, concentric radii and expanded hit areas. Round 2 added blu const state = { mode: "single", width: "fill", theme: "light", rate: 1, sync: true, panes: ["baseline", "kemiljk"], page: "compare", brand: { primary: "", font: "", density: "" }, active: 0, scroll: 0 };
try { Object.assign(state, JSON.parse(localStorage.getItem("uilab") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("uilab", JSON.stringify(state)); } catch (e) {} };

const stage = document.getElementById("stage");
const byId = (id) => VARIANTS.find((v) => v.id === id) || VARIANTS[0];

function frames() { return [...stage.querySelectorAll("iframe")]; }
function post(frame, msg) { try { frame.contentWindow.postMessage(msg, "*"); } catch (e) {} }

function render() {
  stage.className = "stage" + (state.mode === "split" ? " split" : "");
  stage.innerHTML = "";
  const count = state.mode === "split" ? 2 : 1;
  for (let i = 0; i < count; i++) stage.appendChild(makePane(i));
  syncSegs();
  save();
}

function makePane(i) {
  const v = byId(state.panes[i]);
  const pane = document.createElement("section");
  pane.className = "pane";

  const head = document.createElement("div");
  head.className = "pane-head";
  const sel = document.createElement("select");
  sel.id = "pick-" + i;
  sel.setAttribute("aria-label", i === 0 ? "Left variant" : "Right variant");
  VARIANTS.forEach((o, n) => {
    const opt = document.createElement("option");
    opt.value = o.id;
    opt.textContent = (n + 1) + ". " + o.name + (o.ready ? "" : " (not built)");
    if (o.id === v.id) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => { state.panes[i] = sel.value; state.active = i; render(); });
  sel.addEventListener("focus", () => { state.active = i; });
  const note = document.createElement("span");
  note.textContent = v.note;
  head.append(sel, note);

  const wrap = document.createElement("div");
  wrap.className = "frame-wrap" + (state.width !== "fill" ? " narrow" : "");
  if (v.ready) {
    const f = document.createElement("iframe");
    f.title = v.name;
    f.src = v.path + "?theme=" + state.theme;
    if (state.width !== "fill") f.style.width = state.width + "px";
    f.addEventListener("load", () => {
      post(f, { type: "lab:rate", rate: state.rate });
      post(f, { type: "lab:brand", brand: state.brand });
      setTimeout(() => post(f, { type: "lab:scroll", ratio: state.scroll }), 120);
    });
    wrap.appendChild(f);
  } else {
    wrap.innerHTML = '<div class="empty"><strong>' + v.name + ' isn’t built yet</strong>This variant will be the baseline page with ' + v.name + ' applied. Pick Baseline to see the starting point.</div>';
  }
  pane.append(head, wrap);
  return pane;
}

function syncSegs() {
  const vals = { mode: state.mode, width: String(state.width), theme: state.theme, rate: String(state.rate) };
  for (const [id, val] of Object.entries(vals)) {
    document.querySelectorAll("#" + id + " button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === val)));
  }
  document.getElementById("sync").checked = state.sync;
}

function setOpt(key, val) {
  state[key] = val;
  if (key === "mode" || key === "width") { render(); return; }
  if (key === "theme") frames().forEach((f) => post(f, { type: "lab:theme", theme: val }));
  if (key === "rate") frames().forEach((f) => post(f, { type: "lab:rate", rate: val }));
  syncSegs(); save();
}

document.querySelectorAll(".seg").forEach((seg) => {
  seg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const v = b.dataset.v;
    if (seg.id === "page") { showPage(v); return; }
    setOpt(seg.id, seg.id === "rate" ? Number(v) : v);
  });
});
document.getElementById("sync").addEventListener("change", (e) => { state.sync = e.target.checked; save(); });

window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "lab:key") {
    const i = frames().findIndex((f) => f.contentWindow === e.source);
    if (i >= 0) state.active = i;
    onKey(d.key);
    return;
  }
  if (d.type !== "lab:scroll") return;
  state.scroll = d.ratio;
  if (!state.sync) return;
  frames().forEach((f) => { if (f.contentWindow !== e.source) post(f, d); });
});

// Shortcuts also work while a frame has focus: the bridge script inside each variant forwards them.
function onKey(key) {
  if (key === "r") { showPage(state.page === "report" ? "compare" : "report"); return; }
  if (state.page === "report") return;
  const n = Number(key);
  if (n >= 1 && n <= Math.min(9, VARIANTS.length)) {
    const target = state.mode === "split" ? state.active : 0;
    state.panes[target] = VARIANTS[n - 1].id;
    render();
  } else if (key === "s") setOpt("mode", state.mode === "split" ? "single" : "split");
  else if (key === "m") setOpt("rate", state.rate === 1 ? 0.2 : 1);
  else if (key === "d") setOpt("theme", state.theme === "dark" ? "light" : "dark");
}
window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  onKey(e.key);
});


// ---------- Report view ----------
const reportEl = document.getElementById("report");
const reportInner = document.getElementById("report-inner");
const AXES = [["visual","Visual"],["interaction","Interaction"],["accessibility","Access."],["fidelity","Fidelity"],["productFit","App fit"],["performanceCost","Perf. cost"]];
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nameOf = (id) => byId(id).name;
const linksOf = (id) => '<span class="links">' + (LINKS[id] || []).map(([l, u]) => '<a href="' + u + '" target="_blank" rel="noopener">' + esc(l) + '</a>').join("") + "</span>";
const groupOf = (id) => (REVIEW.groups.find((g) => g.ids.includes(id)) || {}).label || "Control";
const avgOf = (id) => { const sc = REVIEW.systems[id].scores; return AXES.reduce((a, [k]) => a + sc[k], 0) / AXES.length; };
const dots = (n) => '<span class="dots" role="img" aria-label="' + n + ' of 5">' + [1,2,3,4,5].map((i) => '<span class="dot' + (i <= n ? " on" : "") + '"></span>').join("") + "</span>";

function buildReport() {
  if (reportInner.dataset.built) return;
  reportInner.dataset.built = "1";
  const order = REVIEW.ranking;
  const base = METRICS.baseline;
  const maxJs = Math.max(...Object.values(METRICS).map((m) => m.jsGz));
  let h = "";
  h += '<section><h1>Which UI system improves the page most?</h1></section>';
  h += '<section class="panel" style="padding:18px 20px;display:grid;gap:12px"><p class="lede">' + esc(REVIEW.summary) + "</p>" + (REVIEW.changes ? '<p class="sub"><strong style="color:var(--fg);font-weight:600">What round 2 changed.</strong> ' + esc(REVIEW.changes) + "</p>" : "") + '<p class="sub"><strong style="color:var(--fg);font-weight:600">Brand test caveat.</strong> During the review the viewer also set each page’s focus-ring color to the forced brand color, so the faint yellow rings mentioned here are partly the test’s doing. The viewer no longer changes the focus ring.</p>' + "</section>";

  h += '<section><h2>Scores</h2><p class="sub" style="margin-bottom:10px">Scores cover both rounds: the original page plus the task list, overlays and sync sections. Each system scored 1 to 5 against the baseline, which counts as 3 on every axis. Perf. cost: 5 means no measurable cost. Rank is the reviewer’s overall judgement of improvement; Avg is the plain mean of the six scores. Click a row to open it in Compare.</p><div class="panel tbl-wrap"><table><thead><tr><th class="rank">#</th><th>System</th>' + AXES.map(([, l]) => "<th>" + l + "</th>").join("") + '<th class="num">Avg</th><th>Best for</th></tr></thead><tbody>';
  ["baseline", ...order].forEach((id, i) => {
    const r = REVIEW.systems[id];
    h += '<tr class="clickable' + (id === "baseline" ? " base" : "") + '" data-open="' + id + '" tabindex="0"><td class="rank">' + (id === "baseline" ? "–" : i) + '</td><td><span class="sys">' + esc(nameOf(id)) + '</span> ' + linksOf(id) + '<br><span class="chip">' + esc(groupOf(id)) + "</span></td>" + AXES.map(([k]) => "<td>" + dots(r.scores[k]) + "</td>").join("") + '<td class="num avg">' + avgOf(id).toFixed(1) + "</td><td>" + esc(r.bestFor) + "</td></tr>";
  });
  h += "</tbody></table></div></section>";

  h += '<section><h2>Kinds of system</h2><div class="groups">' + REVIEW.groups.map((g) => '<div class="panel group-card"><strong>' + esc(g.label) + '</strong><span class="sub">' + g.ids.map(nameOf).map(esc).join(", ") + "</span><p>" + esc(g.note) + "</p></div>").join("") + "</div></section>";

  h += '<section><h2>Performance</h2><p class="sub" style="margin-bottom:10px">Headless Chromium, 4× CPU throttle, no GPU, median of 3 runs. Read these against the baseline row rather than as real-world numbers. Idle CPU is the share of the main thread busy while nobody touches the page, measured unthrottled. Differences under about 25% are noise.</p><div class="panel tbl-wrap"><table><thead><tr><th>System</th><th class="num">JS (gzip)</th><th class="num">Font files</th><th class="num">LCP</th><th class="num">Blocking time</th><th class="num">Layout CPU</th><th class="num">p95 frame</th><th class="num">Idle CPU</th><th>New dependencies</th></tr></thead><tbody>';
  const deps = { fluid: "motion, Base UI, Radix ×10, pdf.js, Inter", libraries: "7 effect packages + three.js", magicui: "motion, next-themes", "ui-craft": "Instrument Sans", taste: "IBM Plex Sans + Mono" };
  ["baseline", ...order].forEach((id) => {
    const m = METRICS[id];
    const hot = (v, b, f) => v > b * f ? ' class="num bad"' : ' class="num"';
    const idleV = IDLE[id] != null ? IDLE[id] + "%" : "≈0%";
    h += '<tr class="clickable' + (id === "baseline" ? " base" : "") + '" data-open="' + id + '" tabindex="0"><td class="sys">' + esc(nameOf(id)) + '</td><td class="num"><span class="bar-cell"><span class="mini' + (m.jsGz > base.jsGz * 1.25 ? " hot" : "") + '" style="width:' + Math.round(60 * m.jsGz / maxJs) + 'px"></span>' + m.jsGz + ' KB</span></td><td class="num">' + (m.font ? m.font + " KB" : "–") + "</td><td" + hot(m.lcp || 99999, base.lcp, 1.3) + ">" + (m.lcp ? m.lcp + " ms" : "not reached") + "</td><td" + hot(m.tbt, base.tbt, 1.5) + ">" + m.tbt.toLocaleString() + " ms</td><td" + hot(m.layout, base.layout, 2) + ">" + m.layout + " ms</td><td" + hot(m.p95, base.p95, 2) + ">" + m.p95 + " ms</td><td" + ((IDLE[id] || 0) > 5 ? ' class="num bad"' : ' class="num"') + ">" + idleV + "</td><td>" + esc(deps[id] || "none") + "</td></tr>";
  });
  h += "</tbody></table></div></section>";

  h += '<section><h2>System notes</h2><div class="cards">' + order.map((id, i) => {
    const r = REVIEW.systems[id];
    return '<article class="panel card"><div class="card-head"><strong>' + (i + 1) + ". " + esc(nameOf(id)) + '</strong><span class="chip">' + avgOf(id).toFixed(1) + ' avg</span></div>' + linksOf(id) + '<p>' + esc(r.verdict) + '</p>' +
      (r.round2 ? '<div><div class="lbl2">Round 2: list, overlays, sync</div><p>' + esc(r.round2) + "</p></div>" : "") +
      (r.brand ? '<div><div class="lbl2">Brand stress test</div><p>' + esc(r.brand) + "</p></div>" : "") +
      (r.highlights.length ? '<div><div class="lbl2">Look for</div><ul>' + r.highlights.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>" : "") +
      (r.issues.length ? '<div><div class="lbl2">Problems found</div><ul>' + r.issues.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>" : "") +
      '<p class="sub">Change size: ' + esc(r.effort) + '</p><button type="button" class="open" data-open="' + id + '">Compare with baseline</button></article>';
  }).join("") + "</div></section>";

  h += '<section><h2>Not included</h2><div class="panel tbl-wrap"><table><tbody>' + [
    ["transitions.dev", "https://transitions.dev", "Its recipes are only on its website, which this build environment couldn’t reach."],
    ["addyosmani/agent-skills", "https://github.com/addyosmani/agent-skills", "General engineering skills. One frontend guide overlaps with the dedicated systems."],
    ["mattpocock/skills", "https://github.com/mattpocock/skills", "Engineering workflow skills (TDD, tickets, PRs), not UI."],
  ].map(([n, u, why]) => '<tr><td><a class="ext" href="' + u + '" target="_blank" rel="noopener">' + esc(n) + '</a></td><td style="white-space:normal">' + esc(why) + "</td></tr>").join("") + "</tbody></table></div></section>";
  h += '<section class="sub"><h2 style="color:var(--fg)">How this was made</h2><p>Every system started from the same baseline page. A separate agent applied each one, reading only that system’s own docs, and logged its changes in CHANGES.md. A separate reviewer scored the results from light, dark and phone screenshots, the source diffs and targeted browser checks of focus, hover, motion and claimed fixes. Scores are one reviewer’s judgement, so treat close scores as ties.</p></section>';
  reportInner.innerHTML = h;
  reportInner.addEventListener("click", (e) => { if (e.target.closest("a")) return; const t = e.target.closest("[data-open]"); if (t) openCompare(t.dataset.open); });
  reportInner.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.target.closest("a")) { const t = e.target.closest("tr[data-open]"); if (t) openCompare(t.dataset.open); } });
}

function openCompare(id) {
  state.mode = id === "baseline" ? "single" : "split";
  state.panes = id === "baseline" ? ["baseline", state.panes[1]] : ["baseline", id];
  showPage("compare");
}

function showPage(pg) {
  state.page = pg;
  const isReport = pg === "report";
  reportEl.hidden = !isReport;
  stage.hidden = isReport;
  document.querySelectorAll(".compare-only").forEach((el) => { el.hidden = isReport; });
  document.querySelectorAll("#page button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === pg)));
  if (isReport) { buildReport(); if (location.hash !== "#report") history.replaceState(null, "", "#report"); }
  else { if (location.hash) history.replaceState(null, "", location.pathname + location.search); render(); }
  save();
}
window.addEventListener("hashchange", () => showPage(location.hash === "#report" ? "report" : "compare"));

// ---------- Brand stress test + synced actions ----------
if (!state.brand) state.brand = { primary: "", font: "", density: "" };
const statusEl = document.getElementById("status");
function sendBrand() { frames().forEach((f) => post(f, { type: "lab:brand", brand: state.brand })); syncBrandUI(); save(); }
function syncBrandUI() {
  document.querySelectorAll("#swatches .sw").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.c || "") === (state.brand.primary || "") )));
  document.getElementById("font").value = state.brand.font || "";
  document.querySelectorAll("#density button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === (state.brand.density || ""))));
}
document.getElementById("swatches").addEventListener("click", (e) => {
  const b = e.target.closest(".sw"); if (!b) return;
  state.brand.primary = b.dataset.c || ""; sendBrand();
});
document.getElementById("primary-custom").addEventListener("input", (e) => { state.brand.primary = e.target.value; sendBrand(); });
document.getElementById("font").addEventListener("change", (e) => { state.brand.font = e.target.value; sendBrand(); });
document.getElementById("density").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.brand.density = b.dataset.v; sendBrand();
});

const pending = {};
function play(name) {
  const fs = frames();
  pending[name] = { want: fs.length, got: [] };
  fs.forEach((f) => post(f, { type: "lab:action", name }));
  statusEl.textContent = "";
}
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type !== "lab:action-result" || !pending[d.name]) return;
  const i = frames().findIndex((f) => f.contentWindow === e.source);
  pending[d.name].got.push({ i, ok: d.ok });
  const p = pending[d.name];
  if (p.got.length === p.want) {
    const missing = p.got.filter((g) => !g.ok).map((g) => byId(state.panes[g.i]).name);
    statusEl.textContent = missing.length ? "Not found in " + missing.join(" and ") : "";
    delete pending[d.name];
  }
});
document.getElementById("play").addEventListener("click", () => play(document.getElementById("action").value));
document.getElementById("close-all").addEventListener("click", () => play("close"));
let touring = false;
document.getElementById("tour").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget;
  if (touring) { touring = false; return; }
  touring = true; btn.textContent = "Stop";
  const steps = ["dialog", "close", "menu", "close", "sheet", "close", "command", "close", "task-add", "task-complete", "task-sort", "task-remove", "save-fail", "toast", "reload", "ledger-sort", "ledger-empty", "ledger-clear", "wizard-invalid", "wizard-fill", "wizard-next", "wizard-next", "wizard-cancel", "close"];
  const pause = (ms) => new Promise((r) => setTimeout(r, ms / Math.max(state.rate, 0.2) ** 0.5));
  for (const s of steps) {
    if (!touring) break;
    statusEl.textContent = "Tour: " + (document.querySelector('#action option[value="' + s + '"]')?.textContent || "close overlays");
    play(s);
    await pause(s === "close" ? 700 : 1500);
  }
  touring = false; btn.textContent = "Tour"; statusEl.textContent = "";
});
syncBrandUI();

showPage(location.hash === "#report" ? "report" : (state.page || "compare"));
</script>
